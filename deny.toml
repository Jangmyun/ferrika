# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
#
#   cargo deny check
#
# The license list below was derived from Cargo.lock of the public crates
# (`ferrika-core`, `ferrika-cli`; 285 third-party crates) with
# `python3 tools/sbom.py --package ferrika-cli`; see docs/sbom/LICENSES-ferrika-cli.md.
# Many crates carry an "A OR B" expression: it is enough that one alternative
# is allowed, so a copyleft alternative such as the LGPL option of one crate
# does not need to be in the list.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # alternative of the wasm/rustix family
    "MIT",
    "ISC",            # ring ("Apache-2.0 AND ISC") and the rustls family
    "BSD-2-Clause",   # librdkafka's license; some Rust crates
    # zstd-sys: the bundled zstd is dual BSD-3-Clause OR GPL-2.0-only; Ferrika
    # takes the BSD-3-Clause option.
    "BSD-3-Clause",
    "Zlib",           # libz-sys / zlib
    "Unlicense",      # memchr, aho-corasick ("Unlicense OR MIT")
    "BSL-1.0",        # alternative of ryu ("Apache-2.0 OR BSL-1.0")
    "Unicode-3.0",    # unicode-ident (data files)
    # MPL-2.0 is file-level copyleft. Two dependencies use it, unmodified:
    # `colored` (terminal colors) and `option-ext` (via `dirs`). Linking them
    # unmodified into an Apache-2.0 binary is allowed if the MPL notice is kept
    # and their source stays available (it does, on crates.io). Modified MPL
    # files would have to be published under MPL-2.0.
    # See docs/sbom/LICENSES-ferrika-cli.md.
    "MPL-2.0",
]

# The workspace crates themselves (Apache-2.0) are checked like any other
# crate. Crates marked `publish = false` are skipped.
[licenses.private]
ignore = true

[bans]
# Duplicate versions come from the async and TLS stacks; keep them visible
# without failing the build.
multiple-versions = "warn"
wildcards = "allow"

[advisories]
# Uses the RustSec advisory database (needs network access in CI).
yanked = "warn"
ignore = [
    # Unmaintained notice (not a vulnerability, no patched version), added to
    # the database on 2026-11-17. Replacing chrono with jiff or time is planned
    # before the first crates.io release.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; migration to jiff/time planned before 0.1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
