# Virtual workspace: ferrika-core (engine), ferrika-governance (policy and
# audit), ferrika-ops (operations), ferrika-mcp (MCP server) and ferrika-cli
# (the `ferrika` command line).
# Dependency direction: ferrika-cli -> ferrika-mcp -> ferrika-ops ->
# ferrika-governance -> ferrika-core. ferrika-rabbitmq (RabbitMQ preview)
# depends on ferrika-core only; ferrika-cli and ferrika-mcp use it. So does
# ferrika-ksql (ksqlDB REST client, preview).
[workspace]
resolver = "2"
members = ["crates/ferrika-core", "crates/ferrika-governance", "crates/ferrika-ops", "crates/ferrika-mcp", "crates/ferrika-cli", "crates/ferrika-rabbitmq", "crates/ferrika-ksql"]

[workspace.package]
version = "0.2.0"
edition = "2021"
# Minimum Rust version (lapin and its AMQP crates need 1.89); CI checks it.
rust-version = "1.89"
license = "Apache-2.0"
description = "A fast, lightweight, native Kafka client and management tool built with Rust"
repository = "https://github.com/Jangmyun/ferrika"
homepage = "https://github.com/Jangmyun/ferrika"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "io-std", "signal", "sync"] }

# Kafka client & engine. "zstd" builds zstd from the bundled source (zstd-sys)
# and links it statically; without it librdkafka is configured with
# WITH_ZSTD=0 and `-c zstd` fails with "libzstd not available at build time".
# Do not use zstd-pkg-config: it needs a system libzstd (not standalone).
rdkafka = { version = "0.39", features = ["cmake-build", "zstd", "libz-static"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
# preserve_order: parsed JSON keeps its key order. Audit log hashes, masked
# payloads and `-f json` output depend on it; without it keys come out sorted.
serde_json = { version = "1.0", features = ["preserve_order"] }
regex = "1.11"

# TLS for the native clients: the Schema Registry and Kafka Connect REST
# clients, OAuth token requests, audit forwarding and the native admin
# requests. The ring backend avoids an OpenSSL/Perl build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Timestamps: policy and token expiry, audit entries, local time in health
# output and lint backup names. jiff reads the system time zone safely in a
# multi-threaded process and handles DST with the IANA database.
jiff = "1"
# HMAC/PBKDF2 for SASL SCRAM in the native admin requests (same ring as rustls)
ring = "0.17"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Observability & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Workspace crates
ferrika-core = { path = "crates/ferrika-core", version = "0.2.0" }
ferrika-governance = { path = "crates/ferrika-governance", version = "0.2.0" }
ferrika-ops = { path = "crates/ferrika-ops", version = "0.2.0" }
ferrika-mcp = { path = "crates/ferrika-mcp", version = "0.2.0" }
ferrika-cli = { path = "crates/ferrika-cli", version = "0.2.0" }
# Without default features (no AMQP client): ferrika-mcp only lists queues,
# exchanges and bindings; ferrika-cli turns `amqp` on for the redrive.
ferrika-rabbitmq = { path = "crates/ferrika-rabbitmq", version = "0.2.0", default-features = false }
ferrika-ksql = { path = "crates/ferrika-ksql", version = "0.2.0" }

# Debug builds (check, clippy, test) keep line tables for ferrika so panics
# and backtraces still name files and lines, and no debug info for
# dependencies: on Windows the PDBs of large dependency trees (rdkafka and
# others) made every test link slow.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Optimized builds for trying the app while working on it: no LTO, many
# codegen units and incremental compilation, so a change rebuilds in about
# 10 s instead of 6 min. Benchmarks and shipped binaries use `--release`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
