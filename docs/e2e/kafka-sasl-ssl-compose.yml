name: ferrika-sasl-ssl-e2e

services:
  kafka-sasl-ssl-1:
    image: apache/kafka:latest
    container_name: kafka-sasl-ssl-1
    hostname: kafka-sasl-ssl-1
    ports: ["19192:19192"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-sasl-ssl-1:9090"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19192,CONTROLLER://0.0.0.0:9090"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-sasl-ssl-1:29092,EXTERNAL://localhost:19192"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:SASL_SSL,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "NHPN9TN9S7aqJdguzNt8kg"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="admin-e2e-password"
        user_admin="admin-e2e-password"
        user_ferrika_e2e="ferrika-e2e-password";
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_KEYSTORE_TYPE: "PKCS12"
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_KEYSTORE_LOCATION: "/etc/kafka/secrets/broker.p12"
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_KEYSTORE_PASSWORD: "broker-e2e-password"
      KAFKA_LISTENER_NAME_EXTERNAL_SSL_KEY_PASSWORD: "broker-e2e-password"
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:admin;User:ANONYMOUS"
    volumes:
      - "./data/sasl-ssl:/var/lib/kafka/data"
      - "./certs:/etc/kafka/secrets:ro"
    networks: [kafka-sasl-ssl-net]

networks:
  kafka-sasl-ssl-net:
    name: ferrika-sasl-ssl-e2e-net
