name: ferrika-sasl-e2e

x-common-environment: &common-environment
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-sasl-1:9090,2@kafka-sasl-2:9090,3@kafka-sasl-3:9090"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"
  CLUSTER_ID: "NHPN9TN9S7aqJdguzNt8kg"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_JVM_PERFORMANCE_OPTS: "-Xms512m -Xmx512m"
  KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
  KAFKA_LISTENER_NAME_EXTERNAL_SASL_ENABLED_MECHANISMS: "PLAIN"
  KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin" password="admin-e2e-password"
    user_admin="admin-e2e-password"
    user_ferrika_e2e="ferrika-e2e-password";
  KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
  KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
  # Internal traffic is isolated on this Compose network. Keeping this principal
  # superuser lets Kafka's bundled admin tool create the test ACLs.
  KAFKA_SUPER_USERS: "User:admin;User:ANONYMOUS"

services:
  kafka-sasl-1:
    image: apache/kafka:latest
    container_name: kafka-sasl-1
    hostname: kafka-sasl-1
    ports: ["19092:19092"]
    environment:
      <<: *common-environment
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9090"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-sasl-1:29092,EXTERNAL://localhost:19092"
    volumes: ["./data/sasl/broker-1:/var/lib/kafka/data"]
    networks: [kafka-sasl-net]

  kafka-sasl-2:
    image: apache/kafka:latest
    container_name: kafka-sasl-2
    hostname: kafka-sasl-2
    ports: ["19093:19093"]
    environment:
      <<: *common-environment
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19093,CONTROLLER://0.0.0.0:9090"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-sasl-2:29092,EXTERNAL://localhost:19093"
    volumes: ["./data/sasl/broker-2:/var/lib/kafka/data"]
    networks: [kafka-sasl-net]

  kafka-sasl-3:
    image: apache/kafka:latest
    container_name: kafka-sasl-3
    hostname: kafka-sasl-3
    ports: ["19094:19094"]
    environment:
      <<: *common-environment
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19094,CONTROLLER://0.0.0.0:9090"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-sasl-3:29092,EXTERNAL://localhost:19094"
    volumes: ["./data/sasl/broker-3:/var/lib/kafka/data"]
    networks: [kafka-sasl-net]

networks:
  kafka-sasl-net:
    name: ferrika-sasl-e2e-net
