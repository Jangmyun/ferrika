# One-node AutoMQ (broker + controller) on MinIO-compatible object storage,
# for end-to-end runs of the ferrika CLI against AutoMQ. Test use only; the
# object-store credentials are public test values.
#
# Follows the single-node quick start in AutoMQ's repository
# (docker/docker-compose.yaml), with an extra EXTERNAL listener so clients on
# the host reach the broker as localhost:49092. Last run: AutoMQ 1.7.5,
# 2026-11-23 (see docs/COMPATIBILITY.md).
#
#   docker compose -f docs/e2e/automq-compose.yml up -d
#   ferrika -b localhost:49092 topics list
#   python3 tools/e2e/smoke.py target/debug/ferrika --broker localhost:49092
#   docker compose -f docs/e2e/automq-compose.yml down -v
#
# Kafka API on localhost:49092, object-store console on localhost:49001.
# The broker needs about 1.5 GB of memory.
name: ferrika-automq

services:
  # S3-compatible object store. MinIO no longer publishes images, so this
  # uses the community build that AutoMQ's own quick start uses.
  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["49001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the data and ops buckets, then exits.
  mc:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing minio/automq-data &&
      mc mb --ignore-existing minio/automq-ops
      "

  automq:
    image: automqinc/automq:1.7.5
    stop_grace_period: 1m
    depends_on:
      mc:
        condition: service_completed_successfully
    environment:
      KAFKA_S3_ACCESS_KEY: minioadmin
      KAFKA_S3_SECRET_KEY: minioadmin
      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g -XX:MetaspaceSize=96m -XX:MaxDirectMemorySize=1G
      CLUSTER_ID: 3D4fXN-yS1-vsQ8aJ_q4Mg
    command:
      - bash
      - -c
      - |
        /opt/automq/kafka/bin/kafka-server-start.sh \
          /opt/automq/kafka/config/kraft/server.properties \
          --override cluster.id=$$CLUSTER_ID \
          --override node.id=0 \
          --override process.roles=broker,controller \
          --override controller.quorum.voters=0@automq:9093 \
          --override controller.quorum.bootstrap.servers=automq:9093 \
          --override listeners=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:49092 \
          --override listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT \
          --override advertised.listeners=PLAINTEXT://automq:9092,EXTERNAL://localhost:49092 \
          --override s3.data.buckets='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true' \
          --override s3.ops.buckets='1@s3://automq-ops?region=us-east-1&endpoint=http://minio:9000&pathStyle=true' \
          --override s3.wal.path='0@s3://automq-data?region=us-east-1&endpoint=http://minio:9000&pathStyle=true'
    ports: ["49092:49092"]
