# Talks to a ksqlDB server's REST API only; no Kafka client. URL parsing,
# the TLS setup (CA file, client certificate), Base64, the profile type,
# PII masking and the policy categories come from ferrika-core.
[dependencies]
ferrika-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
