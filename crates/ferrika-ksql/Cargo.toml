[package]
name = "ferrika-ksql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ferrika ksqlDB client (preview): REST API client, statement classification for policy gates, PII-masked query results"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ksqldb", "kafka", "streaming-sql", "rest-client", "devops"]
