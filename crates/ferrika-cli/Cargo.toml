[package]
name = "ferrika-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["kafka", "cli", "schema-registry", "kafka-connect", "devops"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ferrika_cli"
path = "src/lib.rs"

# The command-line binary is `ferrika`. Keep it distinct from `Ferrika.exe`,
# the name of the separately distributed desktop app: a case-insensitive file
# system would merge the two.
[[bin]]
name = "ferrika"
path = "src/main.rs"

[dependencies]
ferrika-core.workspace = true
ferrika-governance.workspace = true
ferrika-ops.workspace = true
ferrika-mcp.workspace = true
ferrika-rabbitmq = { workspace = true, features = ["amqp"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
tokio.workspace = true
rdkafka.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
jiff.workspace = true
ring.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
comfy-table = "8.0"
colored = "3.1"
# `ferrika top` dashboard (feature `tui`). crossterm is pinned to the
# version ratatui's backend uses, so there is one copy of it.
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"], optional = true }
crossterm = { version = "0.29", optional = true }

[build-dependencies]
# Version information in ferrika.exe (build.rs); unused on other targets.
winresource = "0.1"

[dev-dependencies]
ferrika-governance = { path = "../ferrika-governance", features = ["test-util"] }

[features]
default = ["tui"]
# The interactive `ferrika top` dashboard (ratatui and crossterm). Without
# it, `top` prints a refreshing plain-text view instead.
tui = ["dep:ratatui", "dep:crossterm"]
# Forwarded to ferrika-core, see there.
ssl = ["ferrika-core/ssl"]
dev-policy-dir = ["ferrika-governance/dev-policy-dir"]
