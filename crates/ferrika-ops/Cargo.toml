[package]
name = "ferrika-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ferrika operations: backup, mirror, DLQ, diff, lint, health, reports and change history with undo"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["kafka", "backup", "mirror", "dead-letter-queue", "lint"]
categories = ["development-tools", "network-programming"]

[dependencies]
ferrika-core.workspace = true
ferrika-governance.workspace = true
# RabbitMQ history and undo (management API only, no AMQP client).
ferrika-rabbitmq.workspace = true
rdkafka.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
tracing.workspace = true
ring.workspace = true

[dev-dependencies]
ferrika-governance = { path = "../ferrika-governance", features = ["test-util"] }
ferrika-rabbitmq = { path = "../ferrika-rabbitmq", default-features = false, features = ["test-util"] }
