[package]
name = "ferrika-rabbitmq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ferrika RabbitMQ support (preview): management HTTP API client, connection profiles and AMQP dead-letter redrive"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["rabbitmq", "amqp", "management-api", "dead-letter", "devops"]
categories = ["api-bindings", "network-programming"]

# The HTTP client (`ferrika_core::kafka::http::Endpoint`), Base64, the OS
# credential store and the config directory come from ferrika-core.
[dependencies]
ferrika-core.workspace = true
# `--name ... --regex` for bindings, which the management API filters only
# for queues and exchanges (and to check a pattern before sending it).
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# AMQP 0-9-1 (MIT), only for moving messages (`dlq redrive --execute`):
# manual acks and publisher confirms, which the management API lacks. On
# tokio; TLS through rustls with the ring backend and the OS trust store,
# like the HTTP clients.
lapin = { version = "4.13", default-features = false, features = ["tokio", "rustls--ring", "rustls-native-certs"], optional = true }
# Time limits on the AMQP calls.
tokio = { workspace = true, optional = true }

[features]
default = ["amqp"]
# The AMQP client (`amqp` module). Without it the crate has the management
# API client and the profiles only.
amqp = ["dep:lapin", "dep:tokio"]

[dev-dependencies]
# A fake management API for the paging and delivery-limit tests.
tokio.workspace = true
