[package]
name = "ferrika-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ferrika MCP server: Kafka and RabbitMQ tools for AI agents, read-only by default, policy-gated writes"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["kafka", "mcp", "ai-agents", "llm", "model-context"]
categories = ["development-tools", "network-programming"]

[dependencies]
ferrika-core.workspace = true
ferrika-governance.workspace = true
ferrika-ops.workspace = true
ferrika-rabbitmq.workspace = true
rdkafka.workspace = true
tokio.workspace = true
serde_json.workspace = true
jiff.workspace = true
ring.workspace = true
tracing.workspace = true

[features]
# The `rabbit_dlq_redrive` write tool, which moves messages over AMQP
# (pulls in ferrika-rabbitmq's AMQP client, lapin). Without it the server
# reaches RabbitMQ through the management HTTP API only. ferrika-cli turns
# it on.
amqp = ["ferrika-rabbitmq/amqp"]

[dev-dependencies]
ferrika-governance = { path = "../ferrika-governance", features = ["test-util"] }
