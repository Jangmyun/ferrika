name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Linux: formatting, lints and unit tests. Runs on every push and pull request.
  linux:
    name: Linux (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        # rdkafka builds the bundled librdkafka with CMake.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p ferrika-core -p ferrika-governance -p ferrika-ops -p ferrika-mcp -p ferrika-cli -p ferrika-rabbitmq -p ferrika-mqtt -p ferrika-ksql --all-targets -- -D warnings
      - run: cargo test -p ferrika-core -p ferrika-governance -p ferrika-ops -p ferrika-mcp -p ferrika-cli -p ferrika-rabbitmq -p ferrika-mqtt -p ferrika-ksql
      # The CLI without its default features (no MQTT, no TUI) must build.
      - run: cargo check -p ferrika-cli --no-default-features --all-targets

  # API documentation must build without rustdoc warnings (broken intra-doc
  # links, links to private items, stray HTML tags). Public items only.
  docs:
    name: Docs (rustdoc)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # The minimum supported Rust version (`rust-version` in Cargo.toml, also
  # in README.md and CONTRIBUTING.md): everything must still build with it.
  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets -p ferrika-core -p ferrika-governance -p ferrika-ops -p ferrika-mcp -p ferrika-cli -p ferrika-rabbitmq -p ferrika-mqtt -p ferrika-ksql

  # Windows and macOS minutes cost more, and this repository may be private,
  # so these run automatically only once the repository is public. Start them
  # by hand with "Run workflow" (workflow_dispatch) at any time.
  other-os:
    name: ${{ matrix.os }} (clippy, test)
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - name: Check CMake (Windows)
        # The Windows runner image ships CMake and the MSVC build tools.
        if: runner.os == 'Windows'
        run: cmake --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p ferrika-core -p ferrika-governance -p ferrika-ops -p ferrika-mcp -p ferrika-cli -p ferrika-rabbitmq -p ferrika-mqtt -p ferrika-ksql --all-targets -- -D warnings
      - run: cargo test -p ferrika-core -p ferrika-governance -p ferrika-ops -p ferrika-mcp -p ferrika-cli -p ferrika-rabbitmq -p ferrika-mqtt -p ferrika-ksql

  # End-to-end smoke test of the CLI against a real broker (Linux only).
  # A second single-node Kafka (localhost:29092, its own cluster id) is the
  # "dev" cluster of the company-policy test, the first one its "prod".
  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
      kafka2:
        image: apache/kafka:3.9.0
        env:
          CLUSTER_ID: u090P2O1ots4JXdg60zrew
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
        ports:
          - 29092:29092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrika-cli
      - name: Smoke test
        run: python3 tools/e2e/smoke.py target/debug/ferrika --broker localhost:9092
      - name: MCP smoke test
        run: python3 tools/e2e/mcp_smoke.py target/debug/ferrika --broker localhost:9092
      - name: Company policy smoke test
        # Debug build: reads the policy from FERRIKA_POLICY_DIR (a temp dir).
        run: python3 tools/e2e/policy_smoke.py target/debug/ferrika --broker localhost:9092 --broker2 localhost:29092

  # The same smoke test against Redpanda, a Kafka API compatible broker.
  # (A service container cannot take Redpanda's start arguments.)
  e2e-redpanda:
    name: End-to-end smoke test (Redpanda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 9092:9092 \
            docker.redpanda.com/redpandadata/redpanda:v26.3.1 \
            redpanda start --mode dev-container --smp 1 --memory 1G --overprovisioned \
            --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr localhost:9092
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrika-cli
      - name: Wait for Redpanda
        run: |
          for i in $(seq 1 60); do
            docker exec redpanda rpk cluster info >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs redpanda | tail -50
          exit 1
      - name: Smoke test
        run: python3 tools/e2e/smoke.py target/debug/ferrika --broker localhost:9092

  # End-to-end smoke test of `ferrika rabbit` against RabbitMQ (management
  # API and AMQP). The test user comes from the image's default-user env.
  # Kafka is here for the MCP smoke test, which needs a Kafka cluster too.
  e2e-rabbitmq:
    name: End-to-end smoke test (RabbitMQ)
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: ferrika-e2e
          RABBITMQ_DEFAULT_PASS: ferrika-e2e-pw
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrika-cli
      - name: RabbitMQ smoke test
        # No OS credential store on the runner: keep the password in the
        # profile file, which the test checks is private.
        env:
          FERRIKA_SECRET_STORE: file
        run: |
          python3 tools/e2e/rabbit_smoke.py target/debug/ferrika --url http://localhost:15672 \
            --user ferrika-e2e --password ferrika-e2e-pw --amqp-url amqp://localhost:5672
      - name: MCP smoke test with the RabbitMQ tools
        env:
          FERRIKA_SECRET_STORE: file
        run: |
          python3 tools/e2e/mcp_smoke.py target/debug/ferrika --broker localhost:9092             --rabbit-url http://localhost:15672 --rabbit-user ferrika-e2e --rabbit-password ferrika-e2e-pw             --rabbit-amqp-url amqp://localhost:5672

  # End-to-end smoke test of `ferrika ksql` (and the MCP ksqlDB tools,
  # ksql_exec included) against a ksqlDB server on a throw-away Kafka, and a
  # second ksqlDB server that takes HTTPS only with basic authentication and
  # a required client certificate (tools/e2e/ksqldb-tls-setup.sh). Host
  # networking, so Kafka's default advertised listener (localhost:9092)
  # works for ksqlDB.
  e2e-ksqldb:
    name: End-to-end smoke test (ksqlDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Kafka
        run: docker run -d --name kafka --network host apache/kafka:3.9.0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrika-cli
      - name: Start ksqlDB
        run: |
          for i in $(seq 1 60); do
            docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name ksqldb --network host             -e KSQL_BOOTSTRAP_SERVERS=localhost:9092 -e KSQL_LISTENERS=http://0.0.0.0:8088             -e KSQL_KSQL_SERVICE_ID=ferrika_e2e_ confluentinc/ksqldb-server:0.29.0
          # HTTPS on 8089, basic auth, client certificates required.
          sh tools/e2e/ksqldb-tls-setup.sh "$RUNNER_TEMP/ksqldb-tls" ferrika-e2e ferrika-e2e-pw
          docker run -d --name ksqldb-tls --network host -v "$RUNNER_TEMP/ksqldb-tls:/etc/ksqldb-e2e" \
            --env-file "$RUNNER_TEMP/ksqldb-tls/ksqldb.env" confluentinc/ksqldb-server:0.29.0
          T="$RUNNER_TEMP/ksqldb-tls"
          for i in $(seq 1 90); do
            curl -sf http://localhost:8088/info | grep -q RUNNING \
              && curl -sf --cacert "$T/ca.pem" --cert "$T/client.pem" --key "$T/client.key" \
                -u ferrika-e2e:ferrika-e2e-pw https://localhost:8089/info | grep -q RUNNING \
              && exit 0
            sleep 2
          done
          docker logs ksqldb | tail -50
          docker logs ksqldb-tls | tail -50
          exit 1
      - name: ksqlDB smoke test
        # No OS credential store on the runner: the TLS profile's password
        # stays in the profile file.
        env:
          FERRIKA_SECRET_STORE: file
        run: >-
          python3 tools/e2e/ksql_smoke.py target/debug/ferrika --url http://localhost:8088 --broker localhost:9092
          --tls-url https://localhost:8089 --tls-user ferrika-e2e --tls-password ferrika-e2e-pw
          --tls-ca "$RUNNER_TEMP/ksqldb-tls/ca.pem" --tls-cert "$RUNNER_TEMP/ksqldb-tls/client.pem"
          --tls-key "$RUNNER_TEMP/ksqldb-tls/client.key"
      - name: MCP smoke test with ksql_exec
        env:
          FERRIKA_SECRET_STORE: file
        run: python3 tools/e2e/mcp_smoke.py target/debug/ferrika --broker localhost:9092 --ksql-url http://localhost:8088
      - name: ksqlDB logs
        if: failure()
        run: |
          docker logs ksqldb | tail -100
          docker logs ksqldb-tls | tail -100

  # End-to-end smoke test of `ferrika mqtt` against Mosquitto 2 with a
  # password file and a TLS listener (test CA from mosquitto-setup.sh). A
  # service container cannot mount the generated configuration.
  e2e-mqtt:
    name: End-to-end smoke test (MQTT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Mosquitto
        run: |
          sh tools/e2e/mosquitto-setup.sh "$RUNNER_TEMP/mosquitto" ferrika-e2e ferrika-e2e-pw
          docker run -d --name mosquitto -p 1883:1883 -p 8883:8883 -v "$RUNNER_TEMP/mosquitto:/mosquitto/config" eclipse-mosquitto:2
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrika-cli
      - name: MQTT smoke test
        # No OS credential store on the runner: keep the password in the
        # profile file, which the test checks is private.
        env:
          FERRIKA_SECRET_STORE: file
        run: >-
          python3 tools/e2e/mqtt_smoke.py target/debug/ferrika --url mqtt://localhost:1883
          --user ferrika-e2e --password ferrika-e2e-pw
          --tls-url mqtts://localhost:8883 --ca-file "$RUNNER_TEMP/mosquitto/ca.pem"
      - name: Mosquitto logs
        if: failure()
        run: docker logs --tail 100 mosquitto

  # The same smoke test against AutoMQ (one node on an S3-compatible store);
  # the stack is docs/e2e/automq-compose.yml and starts in under a minute.
  e2e-automq:
    name: End-to-end smoke test (AutoMQ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start AutoMQ
        run: docker compose -f docs/e2e/automq-compose.yml up -d
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrika-cli
      - name: Wait for AutoMQ
        run: |
          for i in $(seq 1 60); do
            target/debug/ferrika -b localhost:49092 --timeout 5 topics list >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker compose -f docs/e2e/automq-compose.yml logs --tail 50
          exit 1
      - name: Smoke test
        run: python3 tools/e2e/smoke.py target/debug/ferrika --broker localhost:49092
      - name: AutoMQ logs
        if: failure()
        run: docker compose -f docs/e2e/automq-compose.yml logs --tail 100 automq

  # Dependency licenses, advisories and sources (see deny.toml).
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Check the shipped CLI and its dependencies (ferrika-core included).
          # Other workspace members are not part of the open-source release.
          manifest-path: ./crates/ferrika-cli/Cargo.toml

  # Every commit of a pull request needs a Signed-off-by line (git commit -s).
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "Missing Signed-off-by: $(git log -1 --format='%h %s' "$commit")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the sign-off with: git commit -s --amend  (or git rebase --signoff)"
            exit 1
          fi
