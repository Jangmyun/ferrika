name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Linux: formatting, lints and unit tests. Runs on every push and pull request.
  linux:
    name: Linux (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        # rdkafka builds the bundled librdkafka with CMake.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p ferrika-core -p ferrika-governance -p ferrika-ops -p ferrika-mcp -p ferrika-cli -p ferrika-rabbitmq --all-targets -- -D warnings
      - run: cargo test -p ferrika-core -p ferrika-governance -p ferrika-ops -p ferrika-mcp -p ferrika-cli -p ferrika-rabbitmq

  # The minimum supported Rust version (`rust-version` in Cargo.toml, also
  # in README.md and CONTRIBUTING.md): everything must still build with it.
  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets -p ferrika-core -p ferrika-governance -p ferrika-ops -p ferrika-mcp -p ferrika-cli -p ferrika-rabbitmq

  # Windows and macOS minutes cost more, and this repository may be private,
  # so these run automatically only once the repository is public. Start them
  # by hand with "Run workflow" (workflow_dispatch) at any time.
  other-os:
    name: ${{ matrix.os }} (clippy, test)
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - name: Check CMake (Windows)
        # The Windows runner image ships CMake and the MSVC build tools.
        if: runner.os == 'Windows'
        run: cmake --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p ferrika-core -p ferrika-governance -p ferrika-ops -p ferrika-mcp -p ferrika-cli -p ferrika-rabbitmq --all-targets -- -D warnings
      - run: cargo test -p ferrika-core -p ferrika-governance -p ferrika-ops -p ferrika-mcp -p ferrika-cli -p ferrika-rabbitmq

  # End-to-end smoke test of the CLI against a real broker (Linux only).
  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrika-cli
      - name: Smoke test
        run: python3 tools/e2e/smoke.py target/debug/ferrika --broker localhost:9092
      - name: MCP smoke test
        run: python3 tools/e2e/mcp_smoke.py target/debug/ferrika --broker localhost:9092

  # The same smoke test against Redpanda, a Kafka API compatible broker.
  # (A service container cannot take Redpanda's start arguments.)
  e2e-redpanda:
    name: End-to-end smoke test (Redpanda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 9092:9092 \
            docker.redpanda.com/redpandadata/redpanda:v26.3.1 \
            redpanda start --mode dev-container --smp 1 --memory 1G --overprovisioned \
            --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr localhost:9092
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrika-cli
      - name: Wait for Redpanda
        run: |
          for i in $(seq 1 60); do
            docker exec redpanda rpk cluster info >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs redpanda | tail -50
          exit 1
      - name: Smoke test
        run: python3 tools/e2e/smoke.py target/debug/ferrika --broker localhost:9092

  # End-to-end smoke test of `ferrika rabbit` against RabbitMQ (management
  # API and AMQP). The test user comes from the image's default-user env.
  e2e-rabbitmq:
    name: End-to-end smoke test (RabbitMQ)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: ferrika-e2e
          RABBITMQ_DEFAULT_PASS: ferrika-e2e-pw
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrika-cli
      - name: RabbitMQ smoke test
        # No OS credential store on the runner: keep the password in the
        # profile file, which the test checks is private.
        env:
          FERRIKA_SECRET_STORE: file
        run: |
          python3 tools/e2e/rabbit_smoke.py target/debug/ferrika --url http://localhost:15672             --user ferrika-e2e --password ferrika-e2e-pw --amqp-url amqp://localhost:5672

  # The same smoke test against AutoMQ (one node on an S3-compatible store);
  # the stack is docs/e2e/automq-compose.yml and starts in under a minute.
  e2e-automq:
    name: End-to-end smoke test (AutoMQ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start AutoMQ
        run: docker compose -f docs/e2e/automq-compose.yml up -d
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ferrika-cli
      - name: Wait for AutoMQ
        run: |
          for i in $(seq 1 60); do
            target/debug/ferrika -b localhost:49092 --timeout 5 topics list >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker compose -f docs/e2e/automq-compose.yml logs --tail 50
          exit 1
      - name: Smoke test
        run: python3 tools/e2e/smoke.py target/debug/ferrika --broker localhost:49092
      - name: AutoMQ logs
        if: failure()
        run: docker compose -f docs/e2e/automq-compose.yml logs --tail 100 automq

  # Dependency licenses, advisories and sources (see deny.toml).
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Check the shipped CLI and its dependencies (ferrika-core included).
          # Other workspace members are not part of the open-source release.
          manifest-path: ./crates/ferrika-cli/Cargo.toml

  # Every commit of a pull request needs a Signed-off-by line (git commit -s).
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "Missing Signed-off-by: $(git log -1 --format='%h %s' "$commit")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the sign-off with: git commit -s --amend  (or git rebase --signoff)"
            exit 1
          fi
